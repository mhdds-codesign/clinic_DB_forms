<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه سلامت | Find a Medical Service</title>
  <!-- Google Fonts: Vazirmatn & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: #e9e4fc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* شبیه‌ساز فریم موبایل دقیقا مشابه طرح */
    .app-screen {
      position: relative;
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 94vh;
      background: linear-gradient(160deg, #6c4ded 0%, #5434e3 45%, #4223d2 100%);
      border-radius: 42px;
      box-shadow: 0 25px 60px rgba(78, 48, 214, 0.35), 0 0 0 10px #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 28px 36px;
      color: #ffffff;
      animation: screenFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes screenFadeIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* پترن‌های شناور و ارگانیک پس‌زمینه دقیقا مثل عکس */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
    }

    .blob-1 {
      width: 260px;
      height: 260px;
      background: rgba(84, 45, 222, 0.6);
      top: -60px;
      left: -80px;
      filter: blur(2px);
    }

    .blob-2 {
      width: 290px;
      height: 290px;
      background: rgba(62, 30, 195, 0.55);
      bottom: 120px;
      right: -100px;
      filter: blur(2px);
    }

    .blob-3 {
      width: 180px;
      height: 180px;
      background: rgba(94, 62, 238, 0.45);
      bottom: -40px;
      left: -50px;
    }

    /* آیکون‌های وکتور پزشکی شناور در پس‌زمینه با شفافیت ملایم */
    .medical-watermark {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      color: rgba(255, 255, 255, 0.12);
      transition: all 0.5s ease;
    }

    .wm-1 { top: 60px; right: 35px; font-size: 26px; animation: floatAnim 6s ease-in-out infinite; }
    .wm-2 { top: 130px; left: 45px; font-size: 32px; animation: floatAnim 8s ease-in-out infinite reverse; }
    .wm-3 { top: 220px; right: 70px; font-size: 24px; animation: floatAnim 7s ease-in-out 1s infinite; }
    .wm-4 { bottom: 260px; left: 30px; font-size: 28px; animation: floatAnim 9s ease-in-out 0.5s infinite reverse; }
    .wm-5 { bottom: 180px; right: 40px; font-size: 30px; animation: floatAnim 6.5s ease-in-out 2s infinite; }
    .wm-6 { top: 50%; right: 20px; font-size: 22px; animation: floatAnim 7.5s ease-in-out 1.5s infinite; }

    @keyframes floatAnim {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(6deg); }
    }

    /* نوار وضعیت بالای صفحه */
    .status-bar {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      opacity: 0.85;
      font-family: 'Poppins', sans-serif;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      font-size: 12px;
    }

    /* محتوای وسط صفحه */
    .content-center {
      position: relative;
      z-index: 3;
      text-align: center;
      margin-top: auto;
      margin-bottom: auto;
      padding: 20px 0;
    }

    /* نشان درخشان وسط */
    .brand-icon-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.1);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 0 0 0 0 rgba(0, 229, 163, 0.3);
      }
      50% {
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.2), 0 0 0 14px rgba(0, 229, 163, 0);
      }
    }

    .brand-icon-wrapper i {
      font-size: 46px;
      color: #00E5A3;
      filter: drop-shadow(0 2px 8px rgba(0, 229, 163, 0.4));
    }

    /* عنوان بزرگ با استایل عکس */
    .title-en {
      font-family: 'Poppins', sans-serif;
      font-size: 38px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      color: #ffffff;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
    }

    .title-fa {
      font-size: 19px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.95);
      margin-bottom: 12px;
    }

    .description {
      font-size: 13.5px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      max-width: 290px;
      margin: 0 auto;
      font-weight: 400;
    }

    /* دکمه‌های پایین صفحه دقیقا طبق عکس */
    .actions-footer {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: auto;
    }

    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #05DFD7 0%, #00E5A3 100%);
      color: #063c32;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0, 229, 163, 0.38);
      border: none;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-login:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 14px 32px rgba(0, 229, 163, 0.5);
      background: linear-gradient(135deg, #26e9e1 0%, #15f0b1 100%);
    }

    .btn-login:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-create-account {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: transparent;
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 30px;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-create-account:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.7);
      transform: translateY(-2px);
    }

    /* انیمیشن خروج به هنگام کلیک روی ورود */
    .transitioning {
      animation: exitSplash 0.55s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    @keyframes exitSplash {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.08) translateY(-20px);
      }
    }
  </style>
</head>
<body>

  <!-- صفحه اپلیکیشن با طراحی اختصاصی مشابه تصویر ارسالی -->
  <div class="app-screen" id="splashScreen">
    
    <!-- لکه‌های بنفش پس‌زمینه ارگانیک -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <!-- آیکون‌های وکتور شناور -->
    <i class="fas fa-plus medical-watermark wm-1"></i>
    <i class="fas fa-heart-pulse medical-watermark wm-2"></i>
    <i class="fas fa-capsules medical-watermark wm-3"></i>
    <i class="fas fa-plus medical-watermark wm-4"></i>
    <i class="fas fa-stethoscope medical-watermark wm-5"></i>
    <i class="fas fa-heart medical-watermark wm-6"></i>

    <!-- نوار وضعیت بالای صفحه -->
    <div class="status-bar">
      <span>۹:۴۱</span>
      <div class="status-icons">
        <i class="fas fa-signal"></i>
        <i class="fas fa-wifi"></i>
        <i class="fas fa-battery-full"></i>
      </div>
    </div>

    <!-- بخش اصلی وسط صفحه -->
    <div class="content-center">
      <div class="brand-icon-wrapper">
        <i class="fas fa-plus"></i>
      </div>
      
      <h1 class="title-en">Find a<br>Medical<br>Service</h1>
      <h2 class="title-fa">سامانه جامع خدمات درمانی</h2>
      
      <p class="description">
        دسترسی سریع و یکپارچه به ثبت و مدیریت اطلاعات بیماران، پزشکان، داروها و ویزیت‌ها
      </p>
    </div>

    <!-- دکمه‌های ورود و ایجاد حساب -->
    <div class="actions-footer">
      <button class="btn-login" id="enterBtn" onclick="goToMenu()">
        <span>ورود به سامانه</span>
        <i class="fas fa-arrow-left"></i>
      </button>

      <a href="menu.html" class="btn-create-account" onclick="goToMenu(event)">
        مشاهده منوی اصلی خدمات
      </a>
    </div>

  </div>

  <script>
    function goToMenu(e) {
      if(e) e.preventDefault();
      const screen = document.getElementById('splashScreen');
      screen.classList.add('transitioning');
      setTimeout(function() {
        window.location.href = 'menu.html';
      }, 450);
    }
  </script>
</body>
</html>
