    * {

    body {

    .app-screen {

    @keyframes fadeIn {
      from {

        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* لکه‌های بزرگ بنفش ارگانیک پشت کارت‌ها دقیقا مشابه تصویر ارسالی */
    .purple-blob {

    }

    .blob-left {

    .blob-right-mid {

      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 18px 38px rgba(90, 61, 224, 0.16);
      border-color: rgba(90, 61, 224, 0.25);
    }

    .service-card:active {
      transform: translateY(-2px);
    }

    /* قاب آیکون با خطوط فانتزی پزشکی مشابه عکس */
    .card-icon-box {

      height: 72px;
      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      transition: all 0.3s ease;
    }

    .service-card:hover .card-icon-box {
      background: #F1EDFF;

      transform: scale(1.08);
    }

    .card-icon-box i {

      color: #5A3DE0;
      transition: all 0.3s ease;

    .card-icon-box.mint i {
      color: #00BA88;

    .service-card:hover .card-icon-box.mint {
      border-color: #00BA88;
      background: #E8FAF4;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #2D1F6B;
      margin-bottom: 4px;
      transition: color 0.25s ease;
    }
